name: verify

on:
  push:
    branches:
      - main
      - "feat/p0-engineering-baseline"
      - "feat/p1-meta-readonly"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xst_meta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xst_meta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xst_meta_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Apply test migrations
        run: pnpm exec prisma migrate deploy
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Security regression - browser bundle contains no Meta secrets
        shell: bash
        run: |
          set -euo pipefail
          static_dir="apps/web/.next/static"
          test -d "$static_dir"
          for marker in \
            "test-token-never-real" \
            "fake-system-user-token" \
            "fake-app-secret" \
            "META_SYSTEM_USER_TOKEN" \
            "META_APP_SECRET"; do
            if grep -R --line-number --fixed-string "$marker" "$static_dir"; then
              echo "Server-only Meta secret marker leaked into browser static bundle: $marker"
              exit 1
            fi
          done
